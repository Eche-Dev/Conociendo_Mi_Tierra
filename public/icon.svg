<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#141f36" />
    </linearGradient>
    <linearGradient id="gold-bright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="gold-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="tepuy-grad" x1="90" y1="105" x2="90" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado con borde dorado -->
  <rect width="180" height="180" rx="38" fill="url(#bg-grad)" stroke="#d4af37" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Silueta de Tepuy / Cordillera -->
  <path d="M26 148 L58 106 L122 106 L154 148 Z" fill="url(#tepuy-grad)" stroke="#b4912d" stroke-width="1.5" />
  <path d="M54 148 L90 124 L126 148 Z" fill="#24344d" stroke="#b4912d" stroke-width="1" />

  <!-- Estrella de los Vientos / Sol de Guayana (8 puntas facetada en 3D) -->
  <g filter="url(#glow)">
    <!-- Punta Norte -->
    <path d="M90 66 L82 58 L90 28 Z" fill="url(#gold-bright)" />
    <path d="M90 66 L98 58 L90 28 Z" fill="url(#gold-deep)" />

    <!-- Punta Este -->
    <path d="M90 66 L98 58 L128 66 Z" fill="url(#gold-bright)" />
    <path d="M90 66 L98 74 L128 66 Z" fill="url(#gold-deep)" />

    <!-- Punta Sur -->
    <path d="M90 66 L98 74 L90 104 Z" fill="url(#gold-bright)" />
    <path d="M90 66 L82 74 L90 104 Z" fill="url(#gold-deep)" />

    <!-- Punta Oeste -->
    <path d="M90 66 L82 74 L52 66 Z" fill="url(#gold-bright)" />
    <path d="M90 66 L82 58 L52 66 Z" fill="url(#gold-deep)" />

    <!-- Punta Nor-Este -->
    <path d="M90 66 L98 58 L114 42 Z" fill="url(#gold-bright)" />
    <path d="M90 66 L98 66 L114 42 Z" fill="url(#gold-deep)" />

    <!-- Punta Sur-Este -->
    <path d="M90 66 L98 66 L114 90 Z" fill="url(#gold-bright)" />
    <path d="M90 66 L90 74 L114 90 Z" fill="url(#gold-deep)" />

    <!-- Punta Sur-Oeste -->
    <path d="M90 66 L90 74 L66 90 Z" fill="url(#gold-bright)" />
    <path d="M90 66 L82 66 L66 90 Z" fill="url(#gold-deep)" />

    <!-- Punta Nor-Oeste -->
    <path d="M90 66 L82 66 L66 42 Z" fill="url(#gold-bright)" />
    <path d="M90 66 L90 58 L66 42 Z" fill="url(#gold-deep)" />
  </g>

  <!-- Núcleo de luz central -->
  <circle cx="90" cy="66" r="4" fill="#ffffff" />
</svg>
